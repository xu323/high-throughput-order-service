# =============================================================
# 預設 application.yml
# 啟動時會根據 SPRING_PROFILES_ACTIVE 載入額外 profile
# =============================================================
spring:
  application:
    name: high-throughput-order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2.0
        acknowledge-mode: auto
        prefetch: 16
        concurrency: 4
        max-concurrency: 16

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 自訂業務參數
order:
  timeout-minutes: ${ORDER_TIMEOUT_MINUTES:15}
  scheduler:
    cron: "0 */1 * * * *"  # 每分鐘掃描逾時訂單

async:
  core-pool-size: ${ASYNC_CORE_POOL_SIZE:8}
  max-pool-size: ${ASYNC_MAX_POOL_SIZE:32}
  queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}
  thread-name-prefix: hto-async-

cache:
  product-ttl-seconds: 300
  inventory-ttl-seconds: 30

lock:
  redis:
    wait-millis: 200
    lease-millis: 5000

logging:
  level:
    root: INFO
    com.xu.orderservice: INFO
    org.hibernate.SQL: WARN
